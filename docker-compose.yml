version: '3.8'

services:
  vps-sentinel:
    build: .
    container_name: vps-sentinel
    restart: always
    ports:
      - "8000:8000"
    pid: host
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PORT=8000
      - HOST=0.0.0.0

